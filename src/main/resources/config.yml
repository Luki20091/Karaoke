  stoppedOtherSender: "&aZatrzymano karaoke gracza {player}."
  stoppedOtherTarget: "&cTwoje karaoke zostało zatrzymane przez admina."
  provideLink: "&cPodaj link do utworu."
  invalidColor: "&cNieprawidłowy kolor. Użyj: czerwony/zielony/niebieski"
  loadingMetadata: "&7Ładuję informacje o utworze…"
  areaOccupied: "&cW pobliżu ({radius} bloków) działa już karaoke. Spróbuj dalej lub użyj /karaoke stop."
  areaOccupiedLate: "&cW pobliżu ({radius} bloków) działa już karaoke."
