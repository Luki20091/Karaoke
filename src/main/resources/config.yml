# Karaoke plugin configuration

metadata:
  # Used to resolve at least the title/author without any API keys
  # Supported: YouTube oEmbed, Spotify oEmbed
  timeoutSeconds: 10
  # Cache resolved titles/authors (seconds). Set 0 to disable.
  cacheTtlSeconds: 3600
  # Prevent unbounded memory growth when many unique links are used.
  # 0 = unlimited (not recommended for public servers)
  cacheMaxEntries: 500
  # How often the cache is cleaned (remove expired + enforce max size)
  cacheCleanupIntervalSeconds: 120

karaoke:
  # Hard stop if we can't resolve the true track duration
  maxDurationSeconds: 600
  # Only one karaoke hologram session is allowed within this radius (in blocks)
  # around the position where /karaoke was executed.
  exclusionRadiusBlocks: 100
  # If metadata fetch hangs/crashes, a start reservation could block an area.
  # This timeout (seconds) expires such reservations automatically.
  startReservationTimeoutSeconds: 30

debug:
  # Enables extra logging in console
  enabled: true
  # Log outgoing HTTP calls/statuses (only if debug.enabled=true)
  http: true

lyrics:
  # Uses https://lrclib.net as a synced-lyrics provider when possible
  # If synced lyrics are not available, the plugin will fall back to plain lyrics
  # and approximate word timings.
  provider: "lrclib"

hologram:
  # How far above the player's feet the hologram center starts
  baseYOffset: 3.0
  # 3 lines -> 3 blocks tall (distance between lines)
  lineSpacing: 1.0
  # Optional yaw offset to make the text face the player (try 180 if it's reversed)
  yawOffset: 180.0

voicechat:
  enabled: true
  distance: 50

