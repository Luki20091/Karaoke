# Karaoke plugin configuration

metadata:
  # Used to resolve at least the title/author without any API keys
  # Supported: YouTube oEmbed, Spotify oEmbed
  timeoutSeconds: 10
  # How many times to retry transient HTTP errors (IO/timeout/429/5xx)
  retries: 1
  # Base backoff between retries (ms)
  retryBackoffMs: 250
  # Cache resolved titles/authors (seconds). Set 0 to disable.
  cacheTtlSeconds: 3600
  # Prevent unbounded memory growth when many unique links are used.
  # 0 = unlimited (not recommended for public servers)
  cacheMaxEntries: 500
  # How often the cache is cleaned (remove expired + enforce max size)
  cacheCleanupIntervalSeconds: 120

karaoke:
  # If false, /karaoke <link> <color> is blocked. Use playlists + cache instead.
  allowDirectLinks: false
  
  # Hard stop if we can't resolve the true track duration
  maxDurationSeconds: 7200
  # Only one karaoke hologram session is allowed within this radius (in blocks)
  # around the position where /karaoke was executed.
  exclusionRadiusBlocks: 100
  # If metadata fetch hangs/crashes, a start reservation could block an area.
  # This timeout (seconds) expires such reservations automatically.
  startReservationTimeoutSeconds: 30

  # Safety limit: deny starting new sessions when too many are already active.
  # 0 = unlimited.
  maxConcurrentSessions: 20

ui:
  actionbar:
    enabled: true
    # How often to update the progress bar (ticks). 20 ticks = 1 second.
    updatePeriodTicks: 4
    # Auto-clear actionbar after no updates for this many seconds.
    timeoutSeconds: 15
    # Width of the progress bar (characters)
    barWidth: 20

debug:
  # Enables extra logging in console
  enabled: false
  # Log outgoing HTTP calls/statuses (only if debug.enabled=true)
  http: false

http:
  # Default User-Agent used for all outgoing HTTP requests (ffmpeg/metadata/lyrics/cache)
  userAgent: KaraokePlugin/1.0

lyrics:
  enabled: true
  timeoutSeconds: 15
  # How many times to retry transient HTTP errors (IO/timeout/429/5xx)
  retries: 2
  # Base backoff between retries (ms)
  retryBackoffMs: 250
  # Uses https://lrclib.net as a synced-lyrics provider when possible
  # If synced lyrics are not available, the plugin will fall back to plain lyrics
  # and approximate word timings.
  provider: lrclib

cache:
  enabled: true
  
  # Persistent cache limit (bytes). Default: 10GB
  maxBytes: 10737418240
  
  # Max size of a single downloaded file (bytes). Default: 1GB
  maxSingleBytes: 1073741824
  
  downloadTimeoutSeconds: 30
  # Legacy key (still supported). Prefer http.userAgent.
  userAgent: KaraokePlugin/1.0
  
  # Optional limit for number of cached audio files.
  # 0 = unlimited
  maxFiles: 40

library:
  # Local music library folder (relative to plugins/Karaoke/).
  # Put your mp3/ogg files here and import them with: /playlist addfile <playlist> <plik.mp3|plik.ogg> [nazwa...]
  enabled: true
  rootDir: music
  # If true, /playlist addfile may point to absolute paths. Keep false for safety.
  allowAbsolutePaths: false

audio:
  # ffmpeg executable path/name used to decode mp3/ogg into PCM for SVC.
  # If ffmpeg isn't available, the plugin can still cache files and show lyrics, but audio playback via SVC won't work.
  ffmpegPath: C:\Users\lukas\Desktop\McWT\plugins\Karaoke\tools\ffmpeg\ffmpeg.exe
  
  # If true, plugin will try to download ffmpeg on first start.
  # This downloads a 3rd-party ffmpeg build and stores it in plugins/Karaoke/tools/ffmpeg.
  autoDownloadFfmpeg: true
  # Provide either a direct ffmpeg binary URL (Linux/macOS typically) or a .zip containing ffmpeg/ffmpeg.exe.
  # Tip: You can host your own ffmpeg binary and point this URL at it.
  # If ffmpegDownloadUrl is set, it overrides OS-specific keys below.
  # Ubuntu amd64 (recommended):
  ffmpegDownloadUrlLinux: https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
  # Windows (zip):
  ffmpegDownloadUrlWindows: https://github.com/BtbN/FFmpeg-Builds/releases/latest/download/ffmpeg-master-latest-win64-gpl.zip
  # Optional override (leave empty to use OS-specific URL above)
  ffmpegDownloadUrl: ''
  # If false, Karaoke won't save auto-fixes (URL/path) to config.yml.
  # Changes still apply for the current runtime.
  persistAutoFixes: true
  ffmpegDownloadTimeoutSeconds: 120

hologram:
  # How far above the player's feet the hologram center starts
  baseYOffset: 2.0
  # Position inside the block on the axis you're facing.
  # 0.5 = centered (old behavior). 0.2 moves closer to the wall in front of you.
  # For the opposite direction, the plugin automatically uses (1.0 - blockInset).
  blockInset: 0.05
  # Extra vertical gap (in blocks) between the header and the lyrics lines.
  # This is used as a "break" after the event line.
  lineSpacingAfterHeader: 1.0
  
  # Header texts (supports legacy & color codes).
  # Placeholders: {title}, {status}
  headerNowPlaying: '&fTytuł: {accent}{title} &f- {status}'
  headerEvent: '&f♫ {accent}Event Karaoke - StremCraft III &f♫'
  
  # Status placeholders used in headerNowPlaying ({status})
  statusPlaying: 'Gra'
  statusPaused: 'Przerwa'
  # 3 lines -> 3 blocks tall (distance between lines)
  lineSpacing: 0.5
  # Optional yaw offset to make the text face the player (try 180 if it's reversed)
  yawOffset: 180.0

  # If true, hologram text is rendered see-through (visible through blocks/players).
  # This maps to FancyHolograms TextHologramData#setSeeThrough.
  seeThrough: false

  # How far away (in blocks) the hologram is visible.
  # -1 = use FancyHolograms default visibility distance.
  visibilityDistanceBlocks: 50

  # Uniform scale for hologram text (TextDisplay scale).
  # 1.0 = default size, 0.8 = smaller, 1.2 = bigger.
  textScale: 1.2

svc:
  # Simple Voice Chat integration (optional)
  # These keys follow the same convention as the WalkieTalkiePlugin.
  enabled: true
  
  # Output volume multiplier for SVC audio.
  # 1.0 = default, 0.5 = half volume, 0.0 = mute.
  volume: 0.7
  
  # For status/diagnostics only (SVC itself is configured separately).
  # If host is blank and address is provided, the plugin will display svc.address.

  # For streamcraft
  # host: 0.0.0.0
  # port: 35133
  
  # For localhost 
  host: 172.19.32.1
  port: 24454

  address: ''
  
  # How far (in blocks) players can hear the karaoke audio.
  distanceBlocks: 40
  
  # Logs a one-time "hooked" message when the SVC API is available.
  logHook: true
  
  # Temporary placeholder while a full "play music from link" pipeline is not implemented.
  # Plays a short tone when a karaoke session starts so you can verify SVC integration.
  testToneOnStart: true
  testToneDurationMs: 700
  testToneFrequencyHz: 440.0
  testToneAmplitude: 0.1

voicechat:
  # Legacy config keys kept for backwards-compatibility.
  # Prefer the svc.* section above.
  enabled: true
  distance: 40

