plugins {
    id 'java'
    id("xyz.jpenilla.run-paper") version "2.3.1"
    id("com.github.johnrengelman.shadow") version "8.1.1"
}

group = 'me.Luki'
version = '1.0-Alpha'

repositories {
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven {
        name = "maxhenkel"
        url = "https://maven.maxhenkel.de/repository/public"
    }
    maven {
        name = "fancyinnovations"
        url = "https://repo.fancyinnovations.com/releases"
    }
}

dependencies {
    compileOnly("io.papermc.paper:paper-api:1.21.8-R0.1-SNAPSHOT")

    // FancyHolograms API (provided by the FancyHolograms plugin at runtime)
    compileOnly("de.oliver:FancyHolograms:2.8.0")

    // Simple Voice Chat API (provided by the voicechat plugin at runtime)
    compileOnly("de.maxhenkel.voicechat:voicechat-api:2.6.0")

    // JSON parsing
    implementation("com.google.code.gson:gson:2.11.0")

    // For extracting .tar.xz ffmpeg builds on Linux
    implementation("org.tukaani:xz:1.10")
}

shadowJar {
    archiveClassifier.set("")
    // Never bundle Paper or the Voice Chat API to avoid classloader mismatches
    dependencies {
        exclude(dependency("io.papermc.paper:.*"))
        exclude(dependency("de.maxhenkel.voicechat:voicechat-api"))
    }
}

tasks.build {
    dependsOn(tasks.shadowJar)
}

tasks {
    runServer {
        // Configure the Minecraft version for our task.
        // This is the only required configuration besides applying the plugin.
        // Your plugin's jar (or shadowJar if present) will be used automatically.
        minecraftVersion("1.21")
    }
}

def targetJavaVersion = 21
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('paper-plugin.yml') {
        expand props
    }
}
